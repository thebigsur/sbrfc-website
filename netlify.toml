# sbrfc.com — static site, no build step. Netlify publishes the repo root.

[build]
  publish = "."

# Serve exactly what is in the repo. Netlify's "pretty URLs" post-processing was
# rewriting about.html to /about in the served HTML, which left the canonical tags
# and the sitemap pointing at a different URL shape than the links on the page.
[build.processing]
  skip_processing = true

# Ad Grants requires the whole site over HTTPS with no mixed content.
# Netlify force-TLS handles the http:// -> https:// redirect; these headers
# make browsers keep it that way and lock down the obvious basics.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"
