# sbrfc.com — static site, no build step. Netlify publishes the repo root.

[build]
  publish = "."

# Pages link to clean URLs (/about, /play) and the canonical tags and sitemap
# use the same shape, so Netlify's pretty-URL processing has nothing to fix.
# (skip_processing was removed in Oct 2026: it never stopped the link rewriting,
# and skipping post-processing risks skipping the form detection that the
# sign-up forms on /play, /mens, /womens, /youth, /sponsor and /coach need.)

# Ad Grants requires the whole site over HTTPS with no mixed content.
# Netlify force-TLS handles the http:// -> https:// redirect; these headers
# make browsers keep it that way and lock down the obvious basics.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/site.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Thank-you pages are form destinations and Google Ads conversion pages:
# keep them out of search results. The <meta name="robots"> tag says the same.
[[headers]]
  for = "/thanks-*"
  [headers.values]
    X-Robots-Tag = "noindex"
